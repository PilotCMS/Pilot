# Add this line to your Herd Nginx config to fix 413 "Request Entity Too Large" errors
# when uploading files larger than the default limit (~1-2MB).
#
# OPTION 1 - Via Herd UI (easiest):
#   1. Open Laravel Herd app
#   2. Go to PHP → PHP Settings
#   3. Increase "Maximum file upload size" to 64M or 128M
#   4. Restart Herd if needed
#
# OPTION 2 - Manual Nginx config:
#   If Option 1 doesn't work, add this line to your site's Nginx config:
#
#   client_max_body_size 64M;
#
#   Edit the Herd site Nginx config for pilot.test.
#
#   You need to run `herd isolate` or secure the site first to create this file.
#   Add the line inside the server { } block, then run: herd restart

client_max_body_size 64M;
